# Grids Nightly AI: every candidate change is pushed to ai-try/<n>, cross-built on Linux,
# then launched on a real Windows runner. The loop only lands changes whose run passes.
name: nightly-check
on:
  push:
    branches: ['ai-try/**']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WINDRES: x86_64-w64-mingw32-windres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: gnu-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: grids-exe
          path: target/x86_64-pc-windows-gnu/release/maguro.exe
          retention-days: 3
      # the test exe cargo just built (not an older one left in the cached deps folder)
      - name: Build unit tests
        shell: bash
        run: |
          exe=$(cargo test --no-run --target x86_64-pc-windows-gnu --message-format=json | jq -r 'select(.profile.test == true) | .executable // empty' | head -n1)
          cp "$exe" grids-test.exe
      - uses: actions/upload-artifact@v4
        with:
          name: grids-test
          path: grids-test.exe
          retention-days: 3
  unit:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grids-test
      - name: Unit tests
        shell: pwsh
        run: '& .\grids-test.exe; if ($LASTEXITCODE) { exit 1 }'
  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grids-exe
      - name: Launch with two folders and check it stays up with a window
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\maguro.exe -ArgumentList 'C:\Windows','C:\Users' -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { throw "maguro.exe exited early (code $($p.ExitCode))" }
          if ($p.MainWindowHandle -eq 0) { throw "maguro.exe has no main window" }
          "alive: pid $($p.Id), title '$($p.MainWindowTitle)', ws $([math]::Round($p.WorkingSet64/1MB)) MB"
      - name: Screenshot
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screen.png")
      - name: Close
        if: always()
        shell: pwsh
        run: Get-Process maguro -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screen.png
          if-no-files-found: ignore
          retention-days: 3
  # Behaviour checks. Informational: a failure here does not fail the run; the loop shows the
  # BEHAVIOR lines to the reviewer, who rejects a change only if it breaks what the change was for.
  behavior:
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grids-exe
      - name: Double-click empty space goes to the parent folder
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class U {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, IntPtr e);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          }
          "@
          function Click { [U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); [U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero) }
          $p = Start-Process -FilePath .\maguro.exe -ArgumentList 'C:\Users\Public','C:\Windows' -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh(); $h = $p.MainWindowHandle
          [void][U]::ShowWindow($h, 3); [void][U]::SetForegroundWindow($h); Start-Sleep -Seconds 2
          $r = New-Object U+RECT; [void][U]::GetWindowRect($h, [ref]$r)
          # first pane's file list, below the few items of C:\Users\Public
          $x = [int]($r.L + 0.40 * ($r.R - $r.L)); $y = [int]($r.T + 0.47 * ($r.B - $r.T))
          [void][U]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 300
          Click; Start-Sleep -Seconds 1
          $p.Refresh(); $before = $p.MainWindowTitle
          Click; Start-Sleep -Milliseconds 80; Click
          Start-Sleep -Seconds 3
          $p.Refresh(); $after = $p.MainWindowTitle
          $ok = $after -like 'Users*'
          "BEHAVIOR dblup_empty_goes_up: $(if ($ok) { 'PASS' } else { 'FAIL' }) (at $x,$y; title before '$before', after '$after')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\behavior.png")
          Stop-Process -Id $p.Id -Force
      - name: Pane numbers in 3x3 at the boundary width and in 4x4 (10-16)
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Collections.Generic;
          public static class W {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr a, int x, int y, int cx, int cy, uint f);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindowEx(IntPtr p, IntPtr after, string cls, string title);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public static List<IntPtr> Panes(IntPtr main) {
              var l = new List<IntPtr>(); var c = IntPtr.Zero;
              while ((c = FindWindowEx(main, c, "MaguroPane", null)) != IntPtr.Zero) if (IsWindowVisible(c)) l.Add(c);
              return l;
            }
          }
          "@
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Rect($h) { $r = New-Object W+RECT; [void][W]::GetWindowRect($h, [ref]$r); $r }
          $dirs = 'C:\Windows','C:\Users','C:\Program Files','C:\Windows\System32','C:\Windows\Fonts','C:\Users\Public',
            'C:\Windows\Temp','C:\ProgramData','C:\Program Files (x86)','C:\Windows\Web','C:\Windows\Help','C:\Windows\Logs',
            'C:\Windows\Media','C:\Windows\INF','C:\Windows\Cursors','C:\Windows\Boot'
          function Launch($cols, $colr, $n) {
            Get-Process maguro -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 1
            $ini = "side=120`ncols=$cols`ncolr=$colr`n" + ((0..($n - 1) | ForEach-Object { "p$_=$($dirs[$_])`n" }) -join '')
            Set-Content -Path .\grids.ini -Value $ini -Encoding ascii -NoNewline
            $p = Start-Process -FilePath .\maguro.exe -PassThru
            Start-Sleep -Seconds 10
            $p.Refresh(); $h = $p.MainWindowHandle
            [void][W]::SetForegroundWindow($h); $h
          }
          # panes in Ctrl+N order (down each column, left to right)
          function Panes($h) { [W]::Panes($h) | Sort-Object { (Rect $_).L }, { (Rect $_).T } }
          # Per pane: is the back button pushed right by the number column, are digits drawn there, is the
          # address edit at least 32 DIP. Expected: shown from 241 px @96 dpi / 362 px @144 dpi.
          function Check($label, $h) {
            Start-Sleep -Seconds 2
            $dpi = [W]::GetDpiForWindow($h); $s = { param($v) [int][math]::Floor($v * $dpi / 96) }
            $edge = @{ 96 = 241; 144 = 362 }[[int]$dpi]
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\panenum_$label.png")
            "screen $($b.Width)x$($b.Height), dpi $dpi, $label"
            $n = 0
            foreach ($q in Panes $h) {
              $n++; $r = Rect $q; $w = $r.R - $r.L
              $nw = (Rect ([W]::GetDlgItem($q, 101))).L - $r.L - (& $s 4)
              $ed = Rect ([W]::GetDlgItem($q, 104)); $ew = $ed.R - $ed.L
              $x0 = $r.L + (& $s 4); $y0 = $r.T + (& $s 4); $bg = $bmp.GetPixel($x0, $y0); $ink = 0
              for ($x = $x0; $x -lt $x0 + $nw; $x++) { for ($y = $y0; $y -lt $r.T + (& $s 26); $y++) { if ($bmp.GetPixel($x, $y) -ne $bg) { $ink++ } } }
              $shown = $nw -gt 0
              $ok = ($shown -eq ($ink -gt 0)) -and (!$shown -or $ew -ge (& $s 32)) -and ($null -eq $edge -or $shown -eq ($w -ge $edge))
              "BEHAVIOR pane_number_${label}_${n}: $(if ($ok) { 'PASS' } else { 'FAIL' }) (pane w $w, number column $nw, digit px $ink, address edit w $ew)"
            }
          }
          # 3x3 at the boundary: resize until the first pane is exactly $want px wide
          $h = Launch '3,3,3' '1,1,1' 9
          [void][W]::ShowWindow($h, 1)
          $e = @{ 96 = 241; 144 = 362 }[[int][W]::GetDpiForWindow($h)]
          foreach ($want in @(($e - 1), $e)) {
            for ($k = 0; $k -lt 5; $k++) {
              $p0 = Rect (Panes $h)[0]; $d = $want - ($p0.R - $p0.L); if ($d -eq 0) { break }
              $wr = Rect $h; [void][W]::SetWindowPos($h, [IntPtr]::Zero, 0, 0, $wr.R - $wr.L + 3 * $d, 700, 4); Start-Sleep -Seconds 1
            }
            Check "3x3_$want" $h
          }
          # 4x4 maximized, narrow left columns and wide right columns: 1-8 may hide, 9-16 (two digits) show
          $h = Launch '4,4,4,4' '0.15,0.15,0.35,0.35' 16
          [void][W]::ShowWindow($h, 3)
          Check '4x4' $h
          Get-Process maguro -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 3
