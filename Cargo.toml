[package]
name = "grids"
version = "0.1.45"
edition = "2021"
description = "Fast multi-pane file manager for Windows"
license = "MIT"
repository = "https://github.com/Samek86/panegrid"
publish = false

[[bin]]
name = "panegrid"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Data_Pdf",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Com_StructuredStorage",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.62"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.11.1"
# Inflate for ZIP-based documents in the preview. Pure Rust, no C. Not called until F3 opens one.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# SHA-256 of a downloaded update. Pure Rust, no C. Used only by the in-app updater.
sha2 = { version = "0.10.8", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
