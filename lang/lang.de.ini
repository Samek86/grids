# Maguro language file (UTF-8; a leading BOM is ignored).
# key = text
# One space after = is the separator. The rest of the line is the value, including trailing spaces.
# \\ is a backslash and \n is a newline. A line that starts with # or ; is a comment.
# [meta] name= is the label in the language list. font= is an optional UI font.
# A missing key falls back to English.
# lang.<code>.user.ini is laid over this file and is never written by Maguro.
# Any other lang.<code>.ini you add (for example lang.es.ini) is listed and left untouched.

